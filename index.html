<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestiario Medieval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flicker-overlay" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="side-menu" aria-label="Menú principal">
      <h1>Bestiario</h1>
      <nav>
        <button class="menu-btn active" type="button">Personajes</button>
        <button class="menu-btn" type="button">Lugares</button>
        <button class="menu-btn" type="button">Historias</button>
      </nav>
    </aside>

    <main class="content-area">
      <section class="panel-section" aria-label="Sección de personajes">
        <header class="panel-header">
          <h2>PERSONAJES</h2>
          <button class="action-btn" type="button" id="openCharacterForm">Agregar personaje</button>
        </header>

        <div class="character-grid" id="characterGrid"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="characterModal" aria-hidden="true" role="dialog" aria-labelledby="characterFormTitle">
    <div class="modal-content">
      <button class="close-modal" id="closeCharacterForm" type="button" aria-label="Cerrar formulario">×</button>
      <h3 id="characterFormTitle">Agregar personaje</h3>

      <form class="character-form" id="characterForm">
        <label for="characterName">Nombre del personaje</label>
        <input id="characterName" name="name" type="text" required>

        <label for="characterType">Tipo</label>
        <input id="characterType" name="type" type="text" required>

        <label for="characterAge">Edad</label>
        <input id="characterAge" name="age" type="text" required>

        <label for="characterBirth">Fecha de nacimiento (opcional)</label>
        <input id="characterBirth" name="birth" type="text" placeholder="Ej: 8 de agosto de 1460">

        <label for="characterStory">Historia (opcional)</label>
        <textarea id="characterStory" name="story" rows="4" placeholder="Escribe la historia"></textarea>

        <label for="characterFile">Archivo desde el dispositivo (opcional)</label>
        <input id="characterFile" name="file" type="file" accept="image/*">

        <button class="action-btn" type="submit">Guardar personaje</button>
      </form>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openCharacterForm');
    const closeBtn = document.getElementById('closeCharacterForm');
    const modal = document.getElementById('characterModal');
    const form = document.getElementById('characterForm');
    const grid = document.getElementById('characterGrid');

    const openModal = () => {
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    };

    const closeModal = () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      form.reset();
    };

    const firstStoryChunk = (text) => {
      const cleanText = (text || '').trim();
      if (!cleanText) return 'Sin historia.';
      const firstSentence = cleanText.match(/.*?[.!?](\s|$)/);
      if (firstSentence) return firstSentence[0].trim();
      return cleanText.length > 120 ? `${cleanText.slice(0, 120).trim()}...` : cleanText;
    };

    const createFileFrame = (file) => {
      if (!file) {
        return `
          <div class="file-frame missing-file" aria-label="Sin archivo">
            <span class="red-cross" aria-hidden="true"></span>
          </div>
        `;
      }

      const previewUrl = URL.createObjectURL(file);
      return `
        <div class="file-frame" aria-label="Vista previa de archivo">
          <img src="${previewUrl}" alt="Archivo de ${file.name}" class="file-preview">
        </div>
      `;
    };

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const fileInput = document.getElementById('characterFile');
      const file = fileInput.files[0];
      const storyPreview = firstStoryChunk(form.story.value);

      const card = document.createElement('article');
      card.className = 'character-card';
      card.innerHTML = `
        <header class="card-head">
          <h3>${form.name.value}</h3>
        </header>
        ${createFileFrame(file)}
        <footer class="card-foot">
          <p><strong>Tipo:</strong> ${form.type.value}</p>
          <p><strong>Edad:</strong> ${form.age.value}</p>
          <p><strong>Nacimiento:</strong> ${form.birth.value || 'No especificado'}</p>
          <p class="story"><strong>Historia:</strong> ${storyPreview}</p>
        </footer>
      `;

      grid.prepend(card);
      closeModal();
    });
  </script>
</body>
</html>
