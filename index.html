<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestiario Medieval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flicker-overlay" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="side-menu" aria-label="Menú principal">
      <h1>Bestiario</h1>
      <nav>
        <button class="menu-btn active" type="button">Personajes</button>
        <button class="menu-btn" type="button">Lugares</button>
        <button class="menu-btn" type="button">Historias</button>
      </nav>
    </aside>

    <main class="content-area">
      <section class="illuminated-card">
        <h2>Crónicas del Reino</h2>
        <p>
          Bienvenido al salón de los relatos antiguos. El fuego de las antorchas ilumina los pergaminos,
          mientras las placas de oro y acero guardan secretos de criaturas, héroes y leyendas.
        </p>
      </section>
    </main>
  </div>
</body>
</html>
