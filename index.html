<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bestiario Medieval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="flicker-overlay" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="side-menu" aria-label="Menú principal">
      <h1>Bestiario</h1>
      <nav>
        <button class="menu-btn active" type="button">Personajes</button>
        <button class="menu-btn" type="button">Lugares</button>
        <button class="menu-btn" type="button">Historias</button>
      </nav>
    </aside>

    <main class="content-area">
      <section class="panel-section" aria-label="Sección de personajes">
        <header class="panel-header">
          <h2>PERSONAJES</h2>
          <button class="action-btn" type="button" id="openCharacterForm">➕ Agregar personaje</button>
        </header>

        <div class="character-grid" id="characterGrid"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="characterModal" aria-hidden="true" role="dialog" aria-labelledby="characterFormTitle">
    <div class="modal-content">
      <button class="close-modal" id="closeCharacterForm" type="button" aria-label="Cerrar formulario">×</button>
      <h3 id="characterFormTitle">✨ Agregar personaje</h3>

      <form class="character-form" id="characterForm">
        <div class="form-main-fields">
        <label for="characterName">Nombre del personaje</label>
        <input id="characterName" name="name" type="text" required>

        <label for="characterType">Tipo</label>
        <select id="characterType" name="type" required></select>

        <label for="characterClan">Clan</label>
        <select id="characterClan" name="clan" required>
          <option value="">Selecciona un clan</option>
        </select>

        <label for="characterAge">Edad</label>
        <input id="characterAge" name="age" type="text" required>

        <label for="characterBirth">Fecha de nacimiento (opcional)</label>
        <input id="characterBirth" name="birth" type="text" placeholder="Ej: 8 de agosto de 1460">

        <label for="characterStory">Historia (opcional)</label>
        <textarea id="characterStory" name="story" rows="4" placeholder="Escribe la historia"></textarea>

        <label for="characterFile">Foto del personaje (opcional)</label>
        <input id="characterFile" name="file" type="file" accept="image/*">

        <div class="form-image-preview" id="formImagePreview" aria-live="polite">
          <span>🖼️ Aquí verás la vista previa de la foto</span>
        </div>
        </div>

        <fieldset class="stats-fieldset">
          <legend>📊 Puntajes</legend>

          <label for="characterSpeed">Velocidad</label>
          <input id="characterSpeed" name="speed" type="number" min="0" step="1" required>

          <label for="characterStrength">Fuerza</label>
          <input id="characterStrength" name="strength" type="number" min="0" step="1" required>

          <label for="characterMagic">Magia</label>
          <input id="characterMagic" name="magic" type="number" min="0" step="1" required>

          <label for="characterIntelligence">Inteligencia</label>
          <input id="characterIntelligence" name="intelligence" type="number" min="0" step="1" required>
        </fieldset>

        <button class="action-btn form-submit" type="submit">💾 Guardar personaje</button>
      </form>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openCharacterForm');
    const closeBtn = document.getElementById('closeCharacterForm');
    const modal = document.getElementById('characterModal');
    const form = document.getElementById('characterForm');
    const grid = document.getElementById('characterGrid');
    const typeSelect = document.getElementById('characterType');
    const clanSelect = document.getElementById('characterClan');
    const fileInput = document.getElementById('characterFile');
    const formImagePreview = document.getElementById('formImagePreview');

    const clanCatalog = {
      'Clanes de Sangre y Sombras': ['Vampiros', 'Espectros', 'Licántropos', 'Lichs', 'Dullahans', 'Nosferatu', 'Revenants', 'Sombras', 'Ghouls (Necrófagos)', 'Banshees'],
      'Clanes de la Naturaleza (Fata)': ['Hadas', 'Dríades', 'Sátiros', 'Ninfas', 'Silfos', 'Ondinas', 'Gnomos', 'Ents', 'Leprechauns', 'Pixies'],
      'Clanes de Guerreros y Gigantes': ['Orcos', 'Trolls', 'Ogros', 'Cíclopes', 'Goblins', 'Enanos', 'Elfos', 'Centauros', 'Minotauros', 'Hobgoblins'],
      'Clanes de los Abismos': ['Sirenas', 'Tritones', 'Selkies', 'Kappas', 'Nixies', 'Krakens', 'Ictio-centauros'],
      'Clanes Infernales y Celestiales': ['Demonios', 'Súcubos/Íncubos', 'Diablos', 'Ángeles', 'Querubines', 'Efrits', 'Marids', 'Nephilim'],
      'Clanes del Este (Yokai y Mitología Asiática)': ['Kitsunes', 'Tengus', 'Onis', 'Tanukis', 'Jiangshis', 'Nagas', 'Rakshasas'],
      'Clanes Artificiales y Alquímicos': ['Golems', 'Homúnculos', 'Autómatas', 'Gárgolas', 'Simulacros'],
      'Clanes de Sabiduría y Magia': ['Brujos', 'Chamanes', 'Nigromantes', 'Oráculos', 'Alquimistas'],
      'Clanes de Bestias Humanoides': ['Dracónidos', 'Arpías', 'Mantícoras', 'Grifos', 'Lamias', 'Kobolds', 'Yuan-ti'],
      'Clanes de las Tierras Sombrías (Folklore)': ['Wendigos', 'Skin-walkers', 'Cadejos', 'Pucas', 'Huldras', 'Ghul'],
      'Entidades del Vacío y Planos Lejanos': ['Eldritch', 'Abeil', 'Thri-kreen', 'Slaad', 'Githyanki'],
      'Clanes de los Elementos Puros': ['Salamandras', 'Djinn', 'Dao', 'Azer', 'Genasíes'],
      'Clanes de la No-Vida Especializada': ['Vampiros de Energía', 'Sombras de Malicia', 'Wights', 'Momias', 'Zombis Conscientes'],
      'Órdenes y Logias Específicas': ['Paladines Oscuros', 'Valkirias', 'Einherjer', 'Berserkers', 'Dríades de Sangre'],
      'Clanes de Ilusión y Mente': ['Doppelgängers', 'Tulpas', 'Íncubos de Pesadilla', 'Rakshasas', 'Eternos']
    };

    const populateTypes = () => {
      typeSelect.innerHTML = '<option value=\"\">Selecciona un tipo</option>';
      Object.keys(clanCatalog).forEach((type) => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        typeSelect.append(option);
      });
    };

    const populateClans = (type) => {
      clanSelect.innerHTML = '<option value=\"\">Selecciona un clan</option>';
      (clanCatalog[type] || []).forEach((clan) => {
        const option = document.createElement('option');
        option.value = clan;
        option.textContent = clan;
        clanSelect.append(option);
      });
    };

    const openModal = () => {
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    };

    const closeModal = () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      form.reset();
      formImagePreview.innerHTML = '<span>🖼️ Aquí verás la vista previa de la foto</span>';
    };

    const renderFormPreview = (file) => {
      if (!file) {
        formImagePreview.innerHTML = '<span>🖼️ Aquí verás la vista previa de la foto</span>';
        return;
      }
      const previewUrl = URL.createObjectURL(file);
      formImagePreview.innerHTML = `<img src="${previewUrl}" alt="Vista previa de ${file.name}">`;
    };

    const firstStoryChunk = (text) => {
      const cleanText = (text || '').trim();
      if (!cleanText) return 'Sin historia.';
      const firstSentence = cleanText.match(/.*?[.!?](\s|$)/);
      if (firstSentence) return firstSentence[0].trim();
      return cleanText.length > 120 ? `${cleanText.slice(0, 120).trim()}...` : cleanText;
    };

    const createFileFrame = (file) => {
      if (!file) {
        return `
          <div class="file-frame missing-file" aria-label="Sin archivo">
            <span class="red-cross" aria-hidden="true"></span>
          </div>
        `;
      }

      const previewUrl = URL.createObjectURL(file);
      return `
        <div class="file-frame" aria-label="Vista previa de archivo">
          <img src="${previewUrl}" alt="Archivo de ${file.name}" class="file-preview">
        </div>
      `;
    };

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    typeSelect.addEventListener('change', (event) => {
      populateClans(event.target.value);
    });
    fileInput.addEventListener('change', (event) => {
      renderFormPreview(event.target.files[0]);
    });

    populateTypes();

    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const file = fileInput.files[0];
      const storyPreview = firstStoryChunk(form.story.value);

      const card = document.createElement('article');
      card.className = 'character-card';
      card.innerHTML = `
        <header class="card-head">
          <h3>${form.name.value}</h3>
        </header>
        ${createFileFrame(file)}
        <footer class="card-foot">
          <p><strong>Tipo:</strong> ${form.type.value}</p>
          <p><strong>Clan:</strong> ${form.clan.value}</p>
          <p><strong>Edad:</strong> ${form.age.value}</p>
          <p><strong>Nacimiento:</strong> ${form.birth.value || 'No especificado'}</p>
          <div class="stats-grid" aria-label="Puntajes del personaje">
            <p><strong>Velocidad:</strong> ${form.speed.value}</p>
            <p><strong>Fuerza:</strong> ${form.strength.value}</p>
            <p><strong>Magia:</strong> ${form.magic.value}</p>
            <p><strong>Inteligencia:</strong> ${form.intelligence.value}</p>
          </div>
          <p class="story"><strong>Historia:</strong> ${storyPreview}</p>
        </footer>
      `;

      grid.prepend(card);
      closeModal();
    });
  </script>
</body>
</html>
